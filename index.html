<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiffinExpress — Ghar Jaisa Khana, Har Din</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --card: #12121a;
  --card2: #1a1a25;
  --accent: #ff6b35;
  --accent2: #f7c548;
  --green: #2ecc71;
  --red: #e74c3c;
  --blue: #3498db;
  --text: #e8e8f0;
  --muted: #8888a0;
  --border: #2a2a3a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
a { color:inherit; text-decoration:none; }
button { cursor:pointer; font-family:inherit; }

/* NAV */
nav { position:fixed; top:0; left:0; right:0; z-index:1000; background:rgba(10,10,15,0.95); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 2rem; height:64px; display:flex; align-items:center; justify-content:space-between; }
nav .logo { font-size:1.4rem; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
nav .nav-links { display:flex; gap:2rem; align-items:center; }
nav .nav-links a { color:var(--muted); font-size:0.95rem; transition:color 0.2s; }
nav .nav-links a:hover, nav .nav-links a.active { color:var(--text); }
nav .cart-btn { position:relative; background:var(--accent); color:#fff; border:none; border-radius:50px; padding:0.5rem 1.2rem; font-size:0.9rem; font-weight:600; }
nav .cart-btn .badge { position:absolute; top:-6px; right:-6px; background:var(--accent2); color:#000; font-size:0.7rem; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; }

/* HERO */
.hero { padding:120px 2rem 60px; text-align:center; background:radial-gradient(ellipse at 50% 0%, rgba(255,107,53,0.12), transparent 60%); }
.hero h1 { font-size:3rem; font-weight:800; margin-bottom:1rem; line-height:1.15; }
.hero h1 span { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.hero p { color:var(--muted); font-size:1.1rem; max-width:600px; margin:0 auto 2rem; }
.hero .cta-row { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }
.btn { padding:0.85rem 2rem; border-radius:50px; font-size:1rem; font-weight:600; border:none; transition:transform 0.2s, box-shadow 0.2s; display:inline-flex; align-items:center; gap:0.5rem; }
.btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(255,107,53,0.3); }
.btn-primary { background:linear-gradient(135deg,var(--accent),#ff8c5a); color:#fff; }
.btn-secondary { background:var(--card2); color:var(--text); border:1px solid var(--border); }
.btn-green { background:linear-gradient(135deg,var(--green),#27ae60); color:#fff; }
.btn-red { background:linear-gradient(135deg,var(--red),#c0392b); color:#fff; }
.btn-blue { background:linear-gradient(135deg,var(--blue),#2980b9); color:#fff; }
.btn-sm { padding:0.4rem 1rem; font-size:0.85rem; }
.btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

/* STATS */
.stats { display:flex; gap:3rem; justify-content:center; padding:2rem 0; flex-wrap:wrap; }
.stat { text-align:center; }
.stat .num { font-size:2.2rem; font-weight:800; color:var(--accent); }
.stat .lbl { color:var(--muted); font-size:0.85rem; }

/* SECTIONS */
.section { padding:4rem 2rem; max-width:1200px; margin:0 auto; }
.section h2 { font-size:2rem; text-align:center; margin-bottom:0.5rem; }
.section .sub { text-align:center; color:var(--muted); margin-bottom:2.5rem; }

/* PACKAGES */
.pkg-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:1.5rem; }
.pkg-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:2rem; transition:transform 0.3s, box-shadow 0.3s; cursor:pointer; position:relative; overflow:hidden; }
.pkg-card:hover { transform:translateY(-4px); box-shadow:0 12px 40px rgba(255,107,53,0.15); }
.pkg-card.featured { border-color:var(--accent); }
.pkg-card .badge { position:absolute; top:1rem; right:1rem; background:var(--accent); color:#fff; padding:0.2rem 0.7rem; border-radius:20px; font-size:0.75rem; font-weight:700; }
.pkg-card h3 { font-size:1.3rem; margin-bottom:0.3rem; }
.pkg-card .pkg-type { color:var(--accent); font-size:0.85rem; font-weight:600; margin-bottom:1rem; }
.pkg-card .price { font-size:2rem; font-weight:800; margin-bottom:0.3rem; }
.pkg-card .price .old { font-size:1rem; color:var(--muted); text-decoration:line-through; font-weight:400; margin-left:0.5rem; }
.pkg-card .save { color:var(--green); font-size:0.85rem; font-weight:600; margin-bottom:1rem; }
.pkg-card .pkg-items { list-style:none; margin-bottom:1.5rem; }
.pkg-card .pkg-items li { color:var(--muted); font-size:0.9rem; padding:0.3rem 0; border-bottom:1px solid var(--border); }
.pkg-card .pkg-items li:last-child { border:none; }

/* MENU */
.menu-tabs { display:flex; gap:0.5rem; justify-content:center; margin-bottom:2rem; flex-wrap:wrap; }
.menu-tab { padding:0.6rem 1.5rem; border-radius:50px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:0.9rem; transition:all 0.2s; }
.menu-tab.active, .menu-tab:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.menu-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1.2rem; }
.menu-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.2rem; transition:transform 0.2s; }
.menu-card:hover { transform:translateY(-2px); }
.menu-card .day { color:var(--accent); font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; }
.menu-card h4 { font-size:1.05rem; margin:0.3rem 0; }
.menu-card .desc { color:var(--muted); font-size:0.85rem; margin-bottom:0.8rem; }
.menu-card .meta { display:flex; justify-content:space-between; align-items:center; }
.menu-card .price { font-size:1.15rem; font-weight:700; color:var(--accent2); }
.menu-card .add-btn { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:0.4rem 1rem; font-size:0.85rem; font-weight:600; }
.menu-card .add-btn:hover { background:#ff8c5a; }

/* CART PAGE */
.page { padding:100px 2rem 4rem; max-width:900px; margin:0 auto; }
.page h2 { margin-bottom:1.5rem; }
.cart-empty { text-align:center; color:var(--muted); padding:4rem 0; }
.cart-empty .icon { font-size:4rem; margin-bottom:1rem; }
.cart-item { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.2rem; display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
.cart-item .info h4 { font-size:1.05rem; }
.cart-item .info .type { color:var(--muted); font-size:0.85rem; }
.cart-item .qty-ctrl { display:flex; align-items:center; gap:0.8rem; }
.cart-item .qty-ctrl button { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--card2); color:var(--text); font-size:1.1rem; display:flex; align-items:center; justify-content:center; }
.cart-item .qty-ctrl .qty { font-weight:700; min-width:24px; text-align:center; }
.cart-item .price { font-weight:700; color:var(--accent2); }
.cart-item .cart-buy { flex-shrink:0; white-space:nowrap; background:linear-gradient(135deg,#4ecca3,#00f0ff); color:#05060f; border:none; border-radius:9px; cursor:pointer; font-family:'Orbitron',sans-serif; font-size:8.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; line-height:1.2; padding:8px 10px; box-shadow:0 0 12px rgba(78,204,163,.35); transition:transform 0.2s, box-shadow 0.2s; }
.cart-item .cart-buy:hover { transform:scale(1.06); box-shadow:0 0 20px rgba(78,204,163,.8); }
.cart-summary { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.5rem; margin-top:1.5rem; }
.cart-summary .row { display:flex; justify-content:space-between; padding:0.5rem 0; color:var(--muted); }
.cart-summary .row.total { border-top:1px solid var(--border); padding-top:1rem; margin-top:0.5rem; font-size:1.2rem; font-weight:800; color:var(--text); }

/* FORM */
.form-group { margin-bottom:1.2rem; }
.form-group label { display:block; margin-bottom:0.4rem; font-size:0.9rem; color:var(--muted); font-weight:500; }
.form-group input, .form-group textarea, .form-group select { width:100%; padding:0.85rem 1rem; border-radius:12px; border:1px solid var(--border); background:var(--card2); color:var(--text); font-size:0.95rem; font-family:inherit; transition:border-color 0.2s; }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline:none; border-color:var(--accent); }

/* ORDER HISTORY */
.order-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.5rem; margin-bottom:1.2rem; }
.order-card .order-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem; }
.order-card .order-id { font-weight:700; color:var(--accent); }
.order-card .order-date { color:var(--muted); font-size:0.85rem; }
.status { padding:0.3rem 1rem; border-radius:20px; font-size:0.8rem; font-weight:700; }
.status-pending { background:rgba(247,197,72,0.15); color:var(--accent2); }
.status-accepted { background:rgba(52,152,219,0.15); color:var(--blue); }
.status-delivering { background:rgba(155,89,182,0.15); color:#9b59b6; }
.status-delivered { background:rgba(46,204,113,0.15); color:var(--green); }
.status-cancelled { background:rgba(231,76,60,0.15); color:var(--red); }
.order-card .items { margin-bottom:1rem; }
.order-card .items .item { color:var(--muted); font-size:0.9rem; padding:0.2rem 0; }
.order-card .order-total { font-weight:700; color:var(--accent2); font-size:1.1rem; }

/* ADMIN */
.admin-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(350px,1fr)); gap:1.5rem; }
.admin-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.5rem; }
.admin-card .order-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem; }
.admin-card .customer { margin-bottom:1rem; }
.admin-card .customer .name { font-weight:700; }
.admin-card .customer .detail { color:var(--muted); font-size:0.85rem; }
.admin-card .actions { display:flex; gap:0.5rem; flex-wrap:wrap; }

/* MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; display:flex; align-items:center; justify-content:center; padding:1rem; }
.modal { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:2rem; max-width:450px; width:100%; text-align:center; }
.modal h3 { margin-bottom:0.5rem; }
.modal p { color:var(--muted); margin-bottom:1.5rem; }
.modal .actions { display:flex; gap:0.8rem; justify-content:center; }

/* TOAST */
.toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); background:var(--card2); border:1px solid var(--border); color:var(--text); padding:0.85rem 1.5rem; border-radius:12px; font-size:0.9rem; z-index:3000; animation:toastIn 0.3s ease; box-shadow:0 8px 30px rgba(0,0,0,0.4); }
.toast.success { border-color:var(--green); }
.toast.error { border-color:var(--red); }
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

/* DAY FILTER */
.day-filter { display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:1.5rem; }
.day-btn { padding:0.4rem 1rem; border-radius:50px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:0.85rem; }
.day-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* WEEK MENU (package expand) */
.pkg-card .week-menu { display:none; margin-top:1.2rem; border-top:1px solid var(--border); padding-top:1.2rem; text-align:left; }
.pkg-card.open .week-menu { display:block; }
.pkg-card .toggle-hint { font-size:0.8rem; color:var(--muted); margin-top:0.8rem; }
.pkg-card.open .toggle-hint .arrow { display:inline-block; transform:rotate(180deg); }
.week-day { margin-bottom:1rem; }
.week-day-name { font-size:0.78rem; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:1px; margin-bottom:0.4rem; }
.week-meal { display:flex; align-items:center; gap:0.6rem; padding:0.35rem 0; border-bottom:1px dashed var(--border); font-size:0.85rem; }
.wm-tag { font-size:0.62rem; font-weight:700; color:var(--muted); border:1px solid var(--border); border-radius:4px; padding:0.1rem 0.35rem; min-width:48px; text-align:center; flex-shrink:0; }
.wm-name { flex:1; }
.wm-price { color:var(--accent2); font-weight:600; }
.week-day-total { text-align:right; font-size:0.78rem; color:var(--muted); padding-top:0.3rem; }
.pkg-actions { display:flex; gap:0.6rem; margin-top:1.2rem; }
.pkg-actions .btn { flex:1; justify-content:center; }

/* PACKAGE STRIP */
.pkg-strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; }
.pkg-strip-card { background:var(--card2); border:1px solid var(--border); border-radius:14px; padding:1.2rem; }
.pkg-strip-card .ps-name { font-weight:700; margin-bottom:0.2rem; }
.pkg-strip-card .ps-meals { color:var(--muted); font-size:0.82rem; margin-bottom:0.8rem; }
.pkg-strip-card .ps-price { font-size:1.3rem; font-weight:800; color:var(--accent2); margin-bottom:0.2rem; }
.pkg-strip-card .ps-price small { font-size:0.8rem; color:var(--muted); font-weight:400; }
.pkg-strip-card .ps-save { color:var(--green); font-size:0.78rem; font-weight:600; margin-bottom:0.9rem; }

/* ===== MEAL CARDS (3D food art) ===== */
.meal-header { display:flex; justify-content:space-between; align-items:center; gap:1.5rem; flex-wrap:wrap; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:1.2rem 1.5rem; margin-bottom:1.5rem; }
.mh-left { display:flex; align-items:center; gap:1rem; }
.mh-icon { font-size:1.8rem; width:52px; height:52px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--accent),#ff8c5a); border-radius:14px; flex-shrink:0; }
.mh-left h3 { font-size:1.5rem; line-height:1.1; }
.mh-left p { color:var(--muted); font-size:0.82rem; margin-top:0.2rem; }
.mh-right { text-align:right; }
.mh-price { font-size:1.6rem; font-weight:800; color:var(--accent); line-height:1.1; }
.mh-price small { font-size:0.75rem; color:var(--muted); font-weight:400; }
.mh-sub { color:var(--muted); font-size:0.8rem; margin-top:0.2rem; }
.mh-badge { display:inline-block; margin-top:0.4rem; background:rgba(52,152,219,0.15); color:var(--blue); font-size:0.7rem; font-weight:700; padding:0.2rem 0.6rem; border-radius:20px; }

.meal-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:1.1rem; }
.meal-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:1.1rem; display:flex; flex-direction:column; transition:transform 0.25s, border-color 0.25s, box-shadow 0.25s; position:relative; }
.meal-card:hover { transform:translateY(-4px); border-color:#3a3a52; box-shadow:0 14px 36px rgba(0,0,0,0.45); }
.meal-card.featured-day { border-color:var(--green); box-shadow:0 0 0 1px rgba(46,204,113,0.35), 0 10px 30px rgba(46,204,113,0.12); }

.meal-art { position:relative; height:150px; display:flex; align-items:center; justify-content:center; margin-bottom:0.9rem; }
.meal-art .art-glow { position:absolute; width:132px; height:132px; border-radius:50%; background:radial-gradient(circle, rgba(120,190,255,0.22) 0%, rgba(120,190,255,0.07) 45%, transparent 72%); filter:blur(2px); }
.meal-art svg { position:relative; width:100%; height:100%; overflow:visible; }
.art-tag { position:absolute; top:4px; right:4px; font-size:0.6rem; font-weight:800; letter-spacing:0.6px; padding:0.18rem 0.5rem; border-radius:20px; text-transform:uppercase; }
.tag-veg { background:rgba(124,194,66,0.18); color:#8fd14f; }
.tag-sweet { background:rgba(247,197,72,0.18); color:var(--accent2); }
.tag-south { background:rgba(52,152,219,0.18); color:#5dade2; }
.tag-protein { background:rgba(155,89,182,0.18); color:#b07cc6; }
.tag-special { background:rgba(236,64,122,0.18); color:#f06f9a; }
.tag-weekend { background:rgba(241,196,15,0.18); color:#f4d03f; }
.tag-comfort { background:rgba(93,173,226,0.18); color:#7fb8e8; }
.tag-thali { background:rgba(230,126,34,0.18); color:#eb984e; }
.tag-premium { background:rgba(241,196,15,0.18); color:#f4d03f; }
.tag-feast { background:rgba(236,64,122,0.18); color:#f06f9a; }

.meal-day { font-size:0.68rem; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--accent); margin-bottom:0.25rem; }
.meal-name { font-size:1.05rem; font-weight:700; line-height:1.25; margin-bottom:0.3rem; }
.meal-desc { color:var(--muted); font-size:0.78rem; line-height:1.45; flex:1; margin-bottom:0.9rem; }
.meal-foot { display:flex; align-items:center; justify-content:space-between; gap:0.6rem; padding-top:0.8rem; border-top:1px solid var(--border); }
.meal-price { font-size:1.15rem; font-weight:800; color:var(--accent); }
.meal-price small { font-size:0.7rem; color:var(--muted); font-weight:400; }
.meal-foot .add-btn { background:var(--accent); color:#fff; border:none; border-radius:9px; padding:0.42rem 0.95rem; font-size:0.8rem; font-weight:700; transition:background 0.2s; }
.meal-foot .add-btn:hover { background:#ff8c5a; }
.meal-foot .add-btn.added { background:var(--green); }

.meal-section { margin-bottom:3.5rem; }
.meal-total-bar { display:flex; justify-content:flex-end; gap:1.5rem; color:var(--muted); font-size:0.85rem; margin-top:0.9rem; flex-wrap:wrap; }
.meal-total-bar b { color:var(--accent2); }

@media (max-width:768px) {
  .hero h1 { font-size:2rem; }
  nav .nav-links { gap:1rem; }
  nav .nav-links a { font-size:0.8rem; }
  .stats { gap:1.5rem; }
}
</style>

<body>

<canvas id="aurora" aria-hidden="true"></canvas>

<nav>
  <a href="#/" class="logo">🍱 TiffinExpress</a>
  <div class="nav-links">
    <a href="#/" data-route="home">Home</a>
    <a href="#/packages" data-route="packages">Packages</a>
    <a href="#/menu" data-route="menu">Menu</a>
    <a href="#/cart" data-route="cart">Cart</a>
    <a href="#/orders" data-route="orders">My Orders</a>
    <a href="#/admin" data-route="admin" id="adminNav">🔐 Admin</a>
    <button class="cart-btn" onclick="goCart()">🛒 <span class="badge" id="cartBadge">0</span></button>
  </div>
</nav>

<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="food-art.js"></script>
<script src="dish-photos.js"></script>
<script src="holo.js"></script>
<script src="notify.js"></script>
<script>
// ===== MEAL CARD RENDERER (3D food photo) =====
function artFor(id) {
  const f = (typeof FOOD_ART !== 'undefined') && FOOD_ART[id];
  return f ? f() : '';
}
function tagClass(t) {
  return (typeof TAG_CLASS !== 'undefined' && TAG_CLASS[t]) || 'tag-veg';
}
function photoFor(id) {
  return (typeof DISH_PHOTOS !== 'undefined') && DISH_PHOTOS[id] ? DISH_PHOTOS[id] : null;
}

function mealCard(item, featured) {
  const ph = photoFor(item.id);
  const art = ph
    ? `<img class="dish-photo" src="img/${item.id}.webp"
             alt="${item.name}"
             loading="lazy" decoding="async"
             style="background-image:url('${ph.lqip}');background-size:cover;background-position:center"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'dish-fallback',innerHTML:'${artFor(item.id).replace(/'/g, "&#39;")}'}))">`
    : `<div class="dish-fallback">${artFor(item.id)}</div>`;
  return `
    <div class="meal-card ${featured ? 'featured-day' : ''}" id="card-${item.id}">
      <button class="pick" id="pick-${item.id}" onclick="togglePick('${item.id}')"
              title="Select karke ek saath buy karo" aria-label="Select ${item.name}">
        <span class="pick-box">✓</span>
      </button>
      <div class="meal-art" data-tilt>
        <div class="art-glow"></div>
        ${art}
        <span class="art-tag ${tagClass(item.type)}">${item.type}</span>
      </div>

// ids of dishes ticked for a bulk add / bulk buy
let picked = [];

function togglePick(id) {
  const i = picked.indexOf(id);
  if (i === -1) picked.push(id); else picked.splice(i, 1);
  syncPickUI();
}

function isPicked(id) { return picked.indexOf(id) !== -1; }

function syncPickUI() {
  // dishes use card-<id> / pick-<id>; packages use card-pkg-<id> / pick-pkg_<id>_<period>
  picked.forEach(key => {
    const card = document.getElementById('card-' + key);
    const btn = document.getElementById('pick-' + key);
    if (card) card.classList.add('picked');
    if (btn) { btn.classList.add('on'); btn.setAttribute('aria-pressed', 'true'); }
    // week-menu rows on the packages page mirror the same selection
    const row = document.getElementById('wrow-' + key);
    const wb = document.getElementById('wpick-' + key);
    if (row) row.classList.add('picked');
    if (wb) { wb.classList.add('on'); wb.setAttribute('aria-pressed', 'true'); }
  });
  document.querySelectorAll('.meal-card.picked, .pkg-card.picked, .pkg-strip-card.picked, .week-meal.picked').forEach(c => {
    const key = c.id.replace(/^card-/, '').replace(/^wrow-/, '');
    if (!isPicked(key)) {
      c.classList.remove('picked');
      const b = document.getElementById('pick-' + key) || document.getElementById('wpick-' + key);
      if (b) { b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); }
    }
  });
  renderPickBar();
}

function clearPicks() {
  picked = [];
  document.querySelectorAll('.meal-card.picked, .pkg-card.picked, .pkg-strip-card.picked, .week-meal.picked')
    .forEach(c => c.classList.remove('picked'));
  document.querySelectorAll('.pick.on, .wm-pick.on').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); });
  renderPickBar();
}

// Every menu item, looked up by id.
function menuItemById(id) {
  for (const meal of Object.values(MENU)) {
    const it = meal.find(x => x.id === id);
    if (it) return it;
  }
  return null;
}

function pickedItems() {
  return picked.map(menuItemById).filter(Boolean);
}

function renderPickBar() {
  const bar = document.getElementById('pickBar');
  if (!bar) return;
  const n = picked.length;
  if (!n) {
    bar.className = 'pick-bar';
    bar.innerHTML = '';
    return;
  }
  // dishes and packages can be mixed in one selection
  const lines = pickedLines();
  const sub = lines.reduce((s, i) => s + i.price * (i.qty || 1), 0);
  const delivery = deliveryFor(lines);
  const total = sub + delivery;
  const pkgCount = lines.filter(isPackageLine).length;
  const dishCount = lines.length - pkgCount;

  const what = [];
  if (dishCount) what.push(`${dishCount} dish${dishCount > 1 ? 'es' : ''}`);
  if (pkgCount) what.push(`${pkgCount} package${pkgCount > 1 ? 's' : ''}`);

  bar.className = 'pick-bar show';
  bar.innerHTML = `
    <div class="pb-count">
      <b>${n}</b> selected${what.length ? ' · ' + what.join(' + ') : ''}
    </div>
    <div class="pb-money">
      <span>Subtotal ₹${sub}</span>
      <span class="pb-del">${delivery ? `+ ₹${delivery} delivery (ek baar)` : 'Delivery FREE'}</span>
      <b>Total ₹${total}</b>
    </div>
    <div class="pb-actions">
      <button class="btn btn-sm btn-secondary" onclick="clearPicks()">Clear</button>
      <button class="btn btn-sm btn-primary" onclick="addPickedToCart()">🛒 Add ${n} to Cart</button>
      <button class="btn btn-sm btn-green" onclick="buyPicked()">⚡ Buy ${n} Now ₹${total}</button>
    </div>
  `;
}

// Add every ticked item — dishes and packages — to the cart in one go.
function addPickedToCart() {
  const lines = pickedLines();
  if (!lines.length) { toast('Pehle kuch items select karo', 'error'); return; }
  let added = 0;
  lines.forEach(it => {
    const existing = cart.find(c => c.id === it.id);
    if (existing) existing.qty++;
    else cart.push({ ...it, qty: it.qty || 1 });
    added++;
  });
  saveCart();
  clearPicks();
  pulseCartBadge();
  const delivery = cartDelivery();
  toast(`🛒 ${added} item${added > 1 ? 's' : ''} cart mein add ho gaye — delivery ${delivery ? 'sirf ek baar ₹' + delivery : 'FREE'}`,
        'success', 'cart');
}

// Buy every ticked item immediately, bypassing the cart.
function buyPicked() {
  const lines = pickedLines().map(i => ({ ...i, qty: i.qty || 1 }));
  if (!lines.length) { toast('Pehle kuch items select karo', 'error'); return; }
  showCheckout(lines, { fromSelection: true });
  // clear the ticks once the order is actually placed
  const btn = document.getElementById('placeBtn');
  if (btn) {
    const prev = btn.onclick;
    btn.onclick = () => { const r = prev && prev(); clearPicks(); return r; };
  }
}

  if (action === 'cart') {

    t.onclick = () => { t.remove(); goCart(); };

function route() {
  const hash = location.hash || '#/';
  const app = document.getElementById('app');
  document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
  const r = hash.replace('#/','').split('?')[0];
  const link = document.querySelector(`[data-route="${r}"]`);
  if (link) link.classList.add('active');

  if (r === '' || r === 'home') renderHome(app);
  else if (r === 'packages') renderPackages(app);
  else if (r === 'menu') renderMenu(app);
  else if (r === 'cart') renderCart(app);
  else if (r === 'orders') renderOrders(app);
  else if (r === 'admin') renderAdmin(app);
  else renderHome(app);
  // stop the order watcher as soon as the admin panel leaves the screen
  if (r !== 'admin' && window.OrderNotify) window.OrderNotify.unmount();
  // arriving at the admin panel arms the ring straight away, no button press
  if (r === 'admin' && window.OrderNotify) window.OrderNotify.mount();
  // the selection bar lives on the menu and packages pages
  if (r !== 'menu' && r !== 'packages') {
    picked = [];
    const bar = document.getElementById('pickBar');
    if (bar) { bar.className = 'pick-bar'; bar.innerHTML = ''; }
  }
  if (typeof window.holoBoot === 'function') window.holoBoot();
  window.scrollTo(0,0);
}

/* ---------- package multi-select ---------- */

// Packages can be ticked alongside dishes: everything lands in the cart in
// one go, and delivery is still charged only once.
function togglePickPkg(id, period) {
  const key = 'pkg_' + id + '_' + period;
  const i = picked.indexOf(key);
  if (i === -1) picked.push(key); else picked.splice(i, 1);
  syncPickUI();
}

// A picked key is either a dish id or "pkg_<id>_<period>".
function pickedEntry(key) {
  if (key.indexOf('pkg_') === 0) {
    const parts = key.split('_');           // pkg, <id>, <period>
    const period = parts[parts.length - 1];
    const pid = parts.slice(1, -1).join('_');
    const p = PACKAGES.find(x => x.id === pid);
    if (p) return pkgToItem(p, period);
    return null;
  }
  const it = menuItemById(key);
  return it ? { ...it, qty: 1 } : null;
}

// Every picked line, dishes and packages alike.
function pickedLines() {
  return picked.map(pickedEntry).filter(Boolean);
}

function orderPackage(id, period) {
  const p = PACKAGES.find(x => x.id === id);
  if (!p) return;
  const item = pkgToItem(p, period);
  const existing = cart.find(c => c.id === item.id);
  if (existing) existing.qty++;
  else cart.push(item);
  saveCart();
  pulseCartBadge();
  toast(`🛒 ${p.name} (${period === 'week' ? 'Weekly' : 'Monthly'}) cart mein add ho gaya — ₹${item.price}`, 'success', 'cart');
}

// Make the cart button jump so the add is visible even when the cart is
// off-screen. The button is the badge's parent.
function pulseCartBadge() {
  const b = document.getElementById('cartBadge');
  if (!b) return;
  const btn = b.closest ? b.closest('.cart-btn') : b.parentElement;
  if (!btn || !btn.classList) return;
  btn.classList.remove('pulse');
  void btn.offsetWidth;      // restart the animation
  btn.classList.add('pulse');
  setTimeout(() => btn.classList.remove('pulse'), 900);
}

// package -> a cart-shaped line item
function pkgToItem(p, period) {
  return {
    id: 'pkg_' + p.id + '_' + period,
    name: `${p.name} — ${period === 'week' ? 'Weekly' : 'Monthly'}`,
    desc: p.desc,
    day: period === 'week' ? '7 din' : '30 din',
    type: 'PACKAGE',
    price: period === 'week' ? p.weekNew : p.monthNew,
    qty: 1,
    isPackage: true,
    mealTypes: p.mealTypes,
    period: period,
  };
}

function buyPackageNow(id, period) {
  const p = PACKAGES.find(x => x.id === id);
  if (!p) return;
  showCheckout([pkgToItem(p, period)], true);
}

function changeQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
  saveCart();
  renderCart(document.getElementById('app'));
}

// Delivery is a flat ₹49 per ORDER — not per item. Select ten dishes and you
// still pay ₹49 once. Package subscriptions already include delivery, so an
// order made only of packages ships free.
const SINGLE_DELIVERY = 49;

// A package line already has delivery baked into its price.
function isPackageLine(i) { return !!(i && i.isPackage); }

// Delivery applies when the order has at least one non-package line.
// Only packages in the basket -> free.
function deliveryFor(list) {
  if (!list || !list.length) return 0;
  return list.some(i => !isPackageLine(i)) ? SINGLE_DELIVERY : 0;
}

// Kept for callers/tests that ask "is this a one-item order".
function isSingleBuy(list) {
  return list.length === 1 && (list[0].qty || 1) === 1 && !isPackageLine(list[0]);
}

// Convenience wrappers over the live cart.
function cartDelivery() { return deliveryFor(cart); }
function cartTotal() {
  return cart.reduce((s, i) => s + i.price * i.qty, 0) + cartDelivery();
}

// items: array of cart-shaped objects. Defaults to the cart.
// `opts.single` marks a one-item instant buy: it must NOT empty the cart.
// `opts.fromSelection` marks a bulk buy of hand-picked dishes.
function showCheckout(items, opts) {
  const o = (typeof opts === 'object' && opts) ? opts : { single: !!opts };
  const list = Array.isArray(items) ? items : cart;
  if (!list.length) { toast('Cart khaali hai!', 'error'); return; }

  const sub = list.reduce((s, i) => s + i.price * i.qty, 0);
  const delivery = deliveryFor(list);
  const total = sub + delivery;
  const free = delivery === 0;
  const count = list.reduce((s, i) => s + (i.qty || 1), 0);

  const title = o.fromSelection ? '🛒 Buy Selected Items'
              : o.single ? 'Buy This Single' : 'Checkout';
  const summary = list.map(i =>
    `<div style="display:flex;justify-content:space-between;font-size:0.85rem;color:var(--muted);padding:0.2rem 0">
       <span>${i.name} ×${i.qty}</span><span>₹${i.price * i.qty}</span>
     </div>`).join('');

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'checkoutModal';
  modal.innerHTML = `
    <div class="modal" style="max-width:500px;text-align:left">
      <h3>📋 ${title}</h3>
      <p style="margin-bottom:1rem">${count} item${count > 1 ? 's' : ''} — apna details bharo</p>
      <div style="background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:0.9rem 1rem;margin-bottom:1.4rem;max-height:220px;overflow:auto">
        ${summary}
        <div style="display:flex;justify-content:space-between;font-size:0.85rem;color:var(--muted);padding:0.25rem 0;border-top:1px solid var(--border);margin-top:0.5rem">
          <span>Subtotal</span><span>₹${sub}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.85rem;padding:0.25rem 0">
          <span style="color:var(--muted)">Delivery</span>
          ${free
            ? `<span style="color:var(--green);font-weight:700">FREE</span>`
            : `<span style="color:var(--amber);font-weight:700">₹${delivery}</span>`}
        </div>
        ${free
          ? `<div class="single-note" style="color:var(--green);border-color:rgba(0,230,118,.35);background:rgba(0,230,118,.08)">✅ Package order — delivery included, kuch extra nahi</div>`
          : `<div class="single-note">🚚 ₹${SINGLE_DELIVERY} delivery — poori order par <b>sirf ek baar</b> lagta hai, item kitne bhi ho</div>`}
        <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);margin-top:0.5rem;padding-top:0.5rem;font-weight:800">
          <span>Total</span><span style="color:var(--accent2)">₹${total}</span>
        </div>
      </div>
      <div class="form-group"><label>Naam *</label><input type="text" id="chkName" placeholder="Apna naam"></div>
      <div class="form-group"><label>Phone *</label><input type="tel" id="chkPhone" placeholder="10 digit phone number"></div>
      <div class="form-group"><label>Address *</label><textarea id="chkAddress" rows="3" placeholder="Delivery address (area, landmark)"></textarea></div>
      <div class="form-group"><label>Payment</label><select id="chkPayment"><option value="cod">Cash on Delivery</option><option value="upi">UPI</option><option value="card">Card</option></select></div>
      <div style="display:flex;gap:1rem;justify-content:flex-end;margin-top:1.5rem">
        <button class="btn btn-secondary btn-sm" onclick="closeCheckout()">Cancel</button>
        <button class="btn btn-primary btn-sm" id="placeBtn">Place Order (₹${total})</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  document.getElementById('placeBtn').onclick = () => placeOrder(list, o);
}

// Buy a single menu item straight away — no cart trip.
function buyNow(id) {
  for (const meal of Object.values(MENU)) {
    const item = meal.find(i => i.id === id);
    if (item) { showCheckout([{ ...item, qty: 1 }], { single: true }); return; }
  }
  const p = PACKAGES.find(x => 'pkg_' + x.id === id || x.id === id);
  if (p) showCheckout([{ ...pkgToItem(p, 'week'), qty: 1 }], { single: true });
}

function closeCheckout() {
  const m = document.getElementById('checkoutModal');
  if (m) m.remove();
}

// `opts` mirrors showCheckout: { single, fromSelection }. Anything other than
// an instant buy clears the cart afterwards.
function placeOrder(items, opts) {
  const o = (typeof opts === 'object' && opts) ? opts : { single: !!opts };
  const name = document.getElementById('chkName').value.trim();
  const phone = document.getElementById('chkPhone').value.trim();
  const address = document.getElementById('chkAddress').value.trim();
  const payment = document.getElementById('chkPayment').value;
  if (!name || !phone || !address) { toast('Saare fields bharo!', 'error'); return; }
  if (phone.replace(/\D/g, '').length < 10) { toast('Valid phone number daalo!', 'error'); return; }

  const list = items || cart;
  const sub = list.reduce((s, i) => s + i.price * i.qty, 0);
  const delivery = deliveryFor(list);
  const total = sub + delivery;
  const order = {
    id: genOrderId(),
    customer: { name, phone, address, payment },
    items: list.map(i => ({ ...i })),
    subtotal: sub,
    delivery: delivery,
    singleBuy: isSingleBuy(list),
    total,
    status: 'pending',
    date: new Date().toISOString(),
    timeline: [{ status: 'pending', time: new Date().toISOString() }],
  };
  orders.unshift(order);
  saveOrders();

  // an instant buy leaves the cart alone; a checkout or a bulk selection
  // consumes what it ordered
  if (!o.single) {
    cart = [];
    saveCart();
  }
  closeCheckout();
  toast(`Order place ho gaya! Order ID: ${order.id}`);
  if (window.OrderNotify) window.OrderNotify.checkNow();
  location.hash = '#/orders';
}

function renderOrders(app) {
  if (orders.length === 0) {
    app.innerHTML = `
      <div class="page">
        <h2>📦 My Orders</h2>
        <div class="cart-empty">
          <div class="icon">📦</div>
          <h3>Abhi koi order nahi!</h3>
          <p>Menu se items add karo aur order karo</p>
          <a href="#/menu" class="btn btn-primary" style="margin-top:1rem">Menu Dekho</a>
        </div>
      </div>
    `;
    return;
  }

  app.innerHTML = `
    <div class="page">
      <h2>📦 My Orders (${orders.length})</h2>
      ${orders.map(o => {
        const d = new Date(o.date);
        const dateStr = d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) + ' ' + d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
        const itemNames = o.items.map(i => `${i.name} ×${i.qty}`).join(', ');
        return `
          <div class="order-card">
            <div class="order-header">
              <span class="order-id">${o.id}</span>
              <span class="order-date">${dateStr}</span>
              <span class="status status-${o.status}">${getStatusLabel(o.status)}</span>
            </div>
            <div class="items">
              ${o.items.map(i => `<div class="item">${i.name} ×${i.qty} — ₹${i.price * i.qty}</div>`).join('')}
              ${o.delivery ? `<div class="item" style="color:var(--amber)">🚚 Single item delivery — ₹${o.delivery}</div>` : ''}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
              <span class="order-total">Total: ₹${o.total}</span>
              ${o.singleBuy ? '<span class="single-tag">⚡ Single Item</span>' : ''}
              <span style="color:var(--muted);font-size:0.85rem">${o.customer.name} · ${o.customer.phone}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function getStatusLabel(s) {
  const m = { pending:'⏳ Pending', accepted:'✅ Accepted', delivering:'🚚 Delivering', delivered:'📦 Delivered', cancelled:'❌ Cancelled' };
  return m[s] || s;
}

// short label without the emoji, for tabs and chips
function getStatusShort(s) {
  return getStatusLabel(s).replace(/^\S+\s/, '');
}

// ===== ADMIN =====
let isAdmin = sessionStorage.getItem('tiffin_admin') === '1';

const STATUS_FLOW = ['pending', 'accepted', 'delivering', 'delivered'];

function renderAdmin(app) {
  if (!isAdmin) {
    app.innerHTML = `
      <div class="page" style="max-width:440px">
        <h2>🔐 Admin Login</h2>
        <p style="color:var(--muted);margin-bottom:1.5rem">Order manage karne ke liye password daalo</p>
        <div class="form-group"><label>Password</label><input type="password" id="adminPass" placeholder="Admin password" onkeydown="if(event.key==='Enter')doAdminLogin()"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doAdminLogin()">Login</button>
        <p style="color:var(--muted);font-size:0.8rem;margin-top:1rem;text-align:center">Default password: <b style="color:var(--cyan)">admin123</b></p>
      </div>
    `;
    return;
  }

  const c = statusCounts();
  const revenue = orders.filter(o => o.status !== 'cancelled').reduce((s, o) => s + (o.total || 0), 0);
  const today = new Date().toDateString();
  const todayOrders = orders.filter(o => new Date(o.date).toDateString() === today);

  app.innerHTML = `
    <div class="page" style="max-width:1280px">
      <div class="admin-head">
        <div>
          <h2>🔐 Admin Dashboard</h2>
          <p style="color:var(--muted);font-size:0.88rem">Saare orders yahan — accept, cancel, deliver sab kar sakte ho</p>
        </div>
        <button class="btn btn-sm btn-red" onclick="logoutAdmin()">Logout</button>
      </div>

      <div class="adm-stats">
        <div class="adm-stat"><div class="n">${orders.length}</div><div class="l">Total Orders</div></div>
        <div class="adm-stat"><div class="n">${todayOrders.length}</div><div class="l">Aaj ke</div></div>
        <div class="adm-stat"><div class="n" style="color:var(--amber)">${c.pending}</div><div class="l">Pending</div></div>
        <div class="adm-stat"><div class="n" style="color:var(--cyan)">${c.accepted}</div><div class="l">Accepted</div></div>
        <div class="adm-stat"><div class="n" style="color:#b07cff">${c.delivering}</div><div class="l">Delivering</div></div>
        <div class="adm-stat"><div class="n" style="color:var(--green)">${c.delivered}</div><div class="l">Delivered</div></div>
        <div class="adm-stat"><div class="n" style="color:var(--red)">${c.cancelled}</div><div class="l">Cancelled</div></div>
        <div class="adm-stat"><div class="n" style="color:var(--mint)">₹${revenue.toLocaleString('en-IN')}</div><div class="l">Revenue</div></div>
      </div>

      <div id="notifBar"></div>

      <div class="adm-toolbar">
        <div class="adm-filters">
          ${['all','pending','accepted','delivering','delivered','cancelled'].map(s => `
            <button class="adm-tab ${s === 'all' ? 'active' : ''}" data-filter="${s}"
                    onclick="filterAdmin('${s}')">
              ${s === 'all' ? 'Saare' : getStatusShort(s)}
              <span class="adm-tab-n">${s === 'all' ? orders.length : c[s]}</span>
            </button>
          `).join('')}
        </div>
        <input type="search" id="admSearch" class="adm-search" placeholder="🔍 Naam, phone ya Order ID se dhundo..."
               oninput="renderAdminGrid()">
      </div>

      <div class="admin-grid" id="adminGrid"></div>
    </div>
  `;
  window._adminFilter = 'all';
  renderAdminGrid();
  if (window.OrderNotify) window.OrderNotify.mount();
}

function statusCounts() {
  const c = { pending: 0, accepted: 0, delivering: 0, delivered: 0, cancelled: 0 };
  orders.forEach(o => { if (o.status in c) c[o.status]++; });
  return c;
}

function doAdminLogin() {
  const pass = document.getElementById('adminPass').value;
  if (pass === ADMIN_PASSWORD) {
    isAdmin = true;
    sessionStorage.setItem('tiffin_admin', '1');
    toast('Admin login successful!');
    renderAdmin(document.getElementById('app'));
  } else {
    toast('Galat password!', 'error');
  }
}

function logoutAdmin() {
  isAdmin = false;
  sessionStorage.removeItem('tiffin_admin');
  toast('Admin logout ho gaya');
  location.hash = '#/';
}

function filterAdmin(status) {
  window._adminFilter = status;
  document.querySelectorAll('.adm-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.filter === status));
  renderAdminGrid();
}

function adminVisible() {
  const f = window._adminFilter || 'all';
  const q = (document.getElementById('admSearch')?.value || '').trim().toLowerCase();
  return orders.filter(o => {
    if (f !== 'all' && o.status !== f) return false;
    if (!q) return true;
    return o.id.toLowerCase().includes(q)
        || (o.customer.name || '').toLowerCase().includes(q)
        || (o.customer.phone || '').includes(q)
        || (o.customer.address || '').toLowerCase().includes(q);
  });
}

function renderAdminGrid() {
  const grid = document.getElementById('adminGrid');
  if (!grid) return;
  const list = adminVisible();

  if (!list.length) {
    grid.innerHTML = `<div class="adm-empty"><div style="font-size:2.4rem">📭</div>
      <b>${orders.length ? 'Is filter mein koi order nahi' : 'Abhi koi order nahi aaya'}</b>
      <span>${orders.length ? 'Doosra filter try karo' : 'Customer order karega to yahan dikhega'}</span></div>`;
    return;
  }

  grid.innerHTML = list.map(o => {
    const d = new Date(o.date);
    const dateStr = d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' })
                  + ' · ' + d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
    const pay = o.customer.payment === 'cod' ? '💵 Cash on Delivery'
              : o.customer.payment === 'upi' ? '📱 UPI' : '💳 Card';
    return `
      <div class="admin-card st-${o.status}">
        <div class="order-header">
          <span class="order-id">${o.id}</span>
          <span class="status status-${o.status}">${getStatusLabel(o.status)}</span>
        </div>
        <div class="adm-when">🕒 ${dateStr}</div>

        <div class="customer">
          <div class="name">${o.customer.name}${o.singleBuy ? ' <span class="single-tag">⚡ Single</span>' : ''}</div>
          <div class="detail">📞 <a href="tel:${o.customer.phone}" style="color:var(--cyan)">${o.customer.phone}</a></div>
          <div class="detail">📍 ${o.customer.address}</div>
          <div class="detail">${pay}</div>
        </div>

        <div class="adm-items">
          ${o.items.map(i => `
            <div class="adm-item">
              <span>${i.name}${i.qty > 1 ? ' ×' + i.qty : ''}</span>
              <span>₹${i.price * i.qty}</span>
            </div>`).join('')}
          <div class="adm-item" style="color:${o.delivery ? 'var(--amber)' : 'var(--green)'}">
            <span>🚚 Delivery</span><span>${o.delivery ? '₹' + o.delivery : 'FREE'}</span>
          </div>
        </div>

        <div class="adm-total">
          <span>Total</span><span>₹${o.total}</span>
        </div>

        ${o.timeline && o.timeline.length ? `
          <div class="adm-timeline">
            ${o.timeline.map(t => `<span class="adm-step st-${t.status}">${getStatusLabel(t.status)}</span>`).join('')}
          </div>` : ''}

        <div class="actions">
          ${o.status === 'pending' ? `
            <button class="btn btn-sm btn-blue" onclick="updateOrderStatus('${o.id}','accepted')">✅ Accept</button>
            <button class="btn btn-sm btn-red" onclick="updateOrderStatus('${o.id}','cancelled')">❌ Cancel</button>` : ''}
          ${o.status === 'accepted' ? `
            <button class="btn btn-sm btn-primary" onclick="updateOrderStatus('${o.id}','delivering')">🚚 Deliver karne bhejo</button>
            <button class="btn btn-sm btn-red" onclick="updateOrderStatus('${o.id}','cancelled')">❌ Cancel</button>` : ''}
          ${o.status === 'delivering' ? `
            <button class="btn btn-sm btn-green" onclick="updateOrderStatus('${o.id}','delivered')">📦 Delivered</button>
            <button class="btn btn-sm btn-red" onclick="updateOrderStatus('${o.id}','cancelled')">❌ Cancel</button>` : ''}
          ${o.status === 'delivered' ? `
            <button class="btn btn-sm btn-secondary" onclick="updateOrderStatus('${o.id}','delivering')">↩︎ Wapas Delivering</button>` : ''}
          ${o.status === 'cancelled' ? `
            <button class="btn btn-sm btn-secondary" onclick="updateOrderStatus('${o.id}','pending')">↩︎ Restore</button>` : ''}
          <button class="btn btn-sm btn-red" onclick="deleteOrder('${o.id}')" title="Order hataao">🗑️</button>
        </div>
      </div>
    `;
  }).join('');
}

function updateOrderStatus(id, status) {
  const order = orders.find(o => o.id === id);
  if (!order) return;
  order.status = status;
  order.timeline = order.timeline || [];
  order.timeline.push({ status, time: new Date().toISOString() });
  saveOrders();
  // keep the header counters honest after a status change
  renderAdmin(document.getElementById('app'));
  toast(`Order ${id}: ${getStatusLabel(status)}`);
}

function deleteOrder(id) {
  if (!confirm(`Order ${id} delete karna hai? Yeh wapas nahi aayega.`)) return;
  orders = orders.filter(o => o.id !== id);
  saveOrders();
  renderAdmin(document.getElementById('app'));
  toast('Order delete ho gaya');
}

// ===== INIT =====
updateCartBadge();
route();
</script>
